schema_version: "0.1"
status: design_input_until_persisted_schema_is_accepted
identifiers:
  format: uuid
  client_semantics: opaque
  stable_across_restart: true
entities:
  Project:
    required:
      - id
      - name
      - workspace_root_ids
    relationships:
      workspace_root_ids: one_or_more_WorkspaceRoot
      thread_ids: many_Thread
  WorkspaceRoot:
    required:
      - id
      - project_id
      - kind
      - location
      - permission_scope
    kinds:
      - local_directory
      - remote_mount
      - artifact_root
    initial_slice_kinds:
      - local_directory
  Thread:
    required:
      - id
      - project_id
      - event_cursor
    relationships:
      event_cursor: ClientCursor
      run_ids: many_Run
      message_ids: many_Message
  Message:
    required:
      - id
      - thread_id
      - role
      - content
      - status
    relationships:
      run_id: optional_target_Run
      origin_run_id: required_for_assistant_Run
      model_invocation_id: unique_for_assistant_ModelInvocation
      artifact_ids: many_Artifact
    invariants:
      - user_messages_are_complete_without_origin
      - assistant_messages_derive_from_stored_assistant_text
      - incomplete_messages_are_excluded_from_context
  ContextManifest:
    required:
      - id
      - thread_id
      - run_id
      - content_hash
      - ordered_entries
    relationships:
      run_id: one_Run
      message_ids: explicitly_selected_Messages
    invariants:
      - immutable_after_commit
      - exact_content_order_and_provenance_are_hashed
      - message_sources_share_run_thread
      - targeted_messages_require_matching_run_and_delivered_state
      - assistant_sources_are_complete_and_same_run_or_between_roots
      - creation_does_not_deliver_input_or_start_provider_work
    initial_slice: durable_text_instructions_and_message_snapshots
  ModelInvocation:
    required:
      - id
      - work_id
      - run_id
      - context_manifest_id
      - context_manifest_hash
      - provider_account_id
      - model_settings
      - purpose
      - state
    relationships:
      run_id: one_Run
      context_manifest_id: one_ContextManifest_for_same_Run
      retry_of: optional_prior_ModelInvocation
    states: [pending, in_flight, completed, failed, cancelled, interrupted]
    invariants:
      - request_settings_are_immutable
      - one_non_terminal_invocation_per_Run
      - retries_create_distinct_attempts_with_same_work_identity
      - active_invocations_prevent_Run_terminal_transition
      - metadata_events_commit_with_state_changes
      - dispatched_attempt_completion_requires_final_usage
    initial_slice: internal_durable_attempts_without_provider_dispatch
  ModelOutputChunk:
    required:
      - id
      - model_invocation_id
      - run_id
      - session_id
      - update_id
      - position
      - stream
      - content
    streams: [assistant_text, reasoning_summary]
    invariants:
      - new_chunks_require_in_flight_invocation
      - positions_are_contiguous_per_attempt
      - exact_update_retries_create_no_new_event
      - chunk_and_event_commit_atomically
      - partial_output_survives_terminal_outcomes
      - hidden_reasoning_is_not_a_supported_stream
    initial_slice: durable_chunks_with_internal_assistant_Message_finalization
  UsageObservation:
    required:
      - id
      - model_invocation_id
      - work_id
      - provider_account_id
      - run_id
      - session_id
      - workspace_id
      - requested_model
      - normalized_update
      - revision
      - quantities
      - completeness
      - is_terminal
    relationships:
      model_invocation_id: one_dispatched_ModelInvocation
      supersedes: optional_previous_revision_for_same_attempt
    invariants:
      - account_and_work_match_immutable_invocation
      - updates_are_idempotent_per_attempt
      - revisions_are_immutable_and_latest_only_contributes_to_totals
      - subsets_do_not_inflate_additive_totals
      - missing_quantities_differ_from_observed_zero
      - metadata_event_commits_with_observation
      - final_usage_and_invocation_outcome_can_commit_atomically
initial_slice: durable_counted_units_with_bounded_latest_revision_ledger_without_valuation
  Run:
    required:
      - id
      - thread_id
      - agent_id
      - state
    relationships:
      parent_run_id: optional_parent_Run
      child_run_ids: many_Run
      task_id: optional_assigned_Task
      tool_call_ids: many_ToolCall
      approval_ids: many_Approval
  Task:
    required:
      - id
      - thread_id
      - objective
      - state
      - dependency_ids
    relationships:
      parent_task_id: optional_parent_Task
      child_task_ids: many_Task
      run_id: optional_assigned_Run
    initial_slice: durable_create_update_assign_transition_and_get
  Agent:
    required:
      - id
      - provider
      - model
      - instructions
      - tool_capabilities
  ToolCall:
    required:
      - id
      - run_id
      - capability
      - scope
      - state
    result:
      inline_or_artifact: true
  Approval:
    required:
      - id
      - tool_call_id
      - decision
    decisions:
      - pending
      - approved
      - rejected
      - expired
  Artifact:
    required:
      - id
      - content_hash
      - media_type
      - size
      - storage_reference
  Permission:
    required:
      - capability
      - scope
      - decision
    decisions:
      - granted
      - denied
  ClientCursor:
    required:
      - thread_id
      - position
state_machine_source: state-machines.yaml
core_contract_source: ../spec/core-contract.md
