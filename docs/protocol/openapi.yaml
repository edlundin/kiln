openapi: 3.1.1
info:
  title: Kiln daemon protocol
  version: 0.19.0
  description: Kiln loopback protocol contract.
security:
  - bearerAuth: []
paths:
  /v1/protocol/negotiate:
    post:
      operationId: negotiate_protocol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NegotiateRequest'
      responses:
        '200':
          description: Negotiated protocol and capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NegotiateResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '405':
          $ref: '#/components/responses/Problem'
  /v1/events:
    get:
      operationId: event_stream
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: string}
        - name: capability
          in: query
          required: true
          schema: {type: string}
        - name: after
          in: query
          required: false
          schema: {type: string}
          description: Exclusive durable Event cursor for reconnect replay.
      responses:
        '101':
          description: WebSocket protocol switch.
        '400':
          $ref: '#/components/responses/Problem'
        '405':
          $ref: '#/components/responses/Problem'
        '426':
          $ref: '#/components/responses/Problem'
  /v1/workspaces:
    post:
      operationId: create_workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Created workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/workspaces/{workspace_id}:
    get:
      operationId: get_workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Stored workspace snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/workspaces/{workspace_id}/sessions:
    post:
      operationId: create_session
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '201':
          description: Created Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{session_id}:
    get:
      operationId: get_session
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Stored Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{session_id}/messages:
    post:
      operationId: append_message
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendMessageRequest'
      responses:
        '201':
          description: Appended immutable user Message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{session_id}/tasks:
    post:
      operationId: create_task
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque non-empty key for idempotent Task creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Durable pending Task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/tasks/{task_id}:
    get:
      operationId: get_task
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Durable Task snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: update_task
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque non-empty key for idempotent Task updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Updated durable Task snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/tasks/{task_id}/assignment:
    post:
      operationId: assign_task
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque non-empty key for idempotent Task assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
      responses:
        '200':
          description: Assigned durable Task snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/tasks/{task_id}/transition:
    post:
      operationId: transition_task
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque non-empty key for idempotent Task transitions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionTaskRequest'
      responses:
        '200':
          description: Transitioned durable Task snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{session_id}/events:
    get:
      operationId: list_session_events
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
        - name: after
          in: query
          required: false
          schema: {type: string, default: "0"}
      responses:
        '200':
          description: Committed Session events after the requested cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventsResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{session_id}/runs:
    get:
      operationId: list_session_runs
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Flat durable Run list whose parent IDs form the Session Run tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRunsResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      operationId: start_run
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque non-empty key for idempotent start-run delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          description: Accepted queued root Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/runs/{parent_run_id}/children:
    post:
      operationId: start_child_run
      parameters:
        - name: parent_run_id
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque non-empty key scoped to the parent Run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartChildRunRequest'
      responses:
        '202':
          description: Accepted queued child Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/tool-calls/{tool_call_id}/approval:
    post:
      operationId: decide_approval
      parameters:
        - name: tool_call_id
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque non-empty key for idempotent approval delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Durable Run snapshot after the approval decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/runs/{run_id}:
    get:
      operationId: get_run
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Durable Run and ToolCall result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /v1/runs/{run_id}/input:
    post:
      operationId: send_run_input
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque non-empty key scoped to the target Run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRunInputRequest'
      responses:
        '201':
          description: Durable queued targeted input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDeliveryResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/runs/{run_id}/reactions:
    post:
      operationId: react_to_run_activity
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1}
          description: Opaque non-empty key scoped to the target Run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactToRunActivityRequest'
      responses:
        '201':
          description: Durable queued reaction to child Run activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDeliveryResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /v1/runs/{run_id}/cancel:
    post:
      operationId: cancel_run
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Durable terminal Run after cancellation completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/artifacts/{content_hash}:
    get:
      operationId: get_artifact
      parameters:
        - name: content_hash
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200':
          description: Immutable artifact bytes.
          headers:
            ETag:
              schema: {type: string}
            X-Content-Type-Options:
              schema: {type: string, const: nosniff}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Stable public error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ClientIdentity: {"additionalProperties":false,"properties":{"build":{"type":"string"},"name":{"type":"string"}},"required":["name","build"],"type":"object"}
    NegotiateRequest: {"additionalProperties":false,"properties":{"client":{"$ref":"#/components/schemas/ClientIdentity"},"max_version":{"type":"string"},"min_version":{"type":"string"},"requested_capabilities":{"items":{"type":"string"},"type":"array"}},"required":["min_version","max_version","client","requested_capabilities"],"type":"object"}
    StoreIdentity: {"properties":{"id":{"type":"string"},"name":{"type":"string"}},"required":["id","name"],"type":"object"}
    NegotiateResponse: {"properties":{"current_event_cursor":{"type":["string","null"]},"event_websocket_endpoint":{"type":"string"},"selected_capabilities":{"items":{"type":"string"},"type":"array"},"selected_version":{"type":"string"},"store_identity":{"$ref":"#/components/schemas/StoreIdentity"},"supported_capabilities":{"items":{"type":"string"},"type":"array"}},"required":["selected_version","supported_capabilities","selected_capabilities","store_identity","current_event_cursor","event_websocket_endpoint"],"type":"object"}
    WebSocketFrame: {"oneOf":[{"properties":{"capability":{"type":"string"},"current_event_cursor":{"type":["string","null"]},"type":{"const":"ack","type":"string"},"version":{"type":"string"}},"required":["type","version","capability","current_event_cursor"],"type":"object"},{"properties":{"code":{"type":"string"},"message":{"type":"string"},"type":{"const":"error","type":"string"}},"required":["type","code","message"],"type":"object"},{"properties":{"event":{"$ref":"#/components/schemas/SessionEventResponse"},"type":{"const":"event","type":"string"}},"required":["type","event"],"type":"object"}]}
    ProblemDetails: {"properties":{"code":{"type":"string"},"detail":{"type":"string"},"status":{"format":"uint16","maximum":65535,"minimum":0,"type":"integer"},"title":{"type":"string"},"type":{"type":"string"}},"required":["type","title","status","code","detail"],"type":"object"}
    CreateWorkspaceRequest: {"additionalProperties":false,"properties":{"name":{"type":"string"},"roots":{"items":{"$ref":"#/components/schemas/WorkspaceRootRequest"},"type":"array"}},"required":["name","roots"],"type":"object"}
    WorkspaceRootRequest: {"additionalProperties":false,"properties":{"name":{"type":"string"},"path":{"type":"string"}},"required":["name","path"],"type":"object"}
    WorkspaceRootResponse: {"properties":{"canonical_path":{"type":"string"},"display_path":{"type":"string"},"git_common_directory_path":{"type":"string"},"name":{"type":"string"},"position":{"format":"uint","minimum":0,"type":"integer"},"state":{"type":"string"},"workspace_root_id":{"type":"string"}},"required":["workspace_root_id","name","display_path","canonical_path","git_common_directory_path","position","state"],"type":"object"}
    WorkspaceResponse: {"properties":{"name":{"type":"string"},"roots":{"items":{"$ref":"#/components/schemas/WorkspaceRootResponse"},"type":"array"},"workspace_id":{"type":"string"}},"required":["workspace_id","name","roots"],"type":"object"}
    AppendMessageRequest: {"additionalProperties":false,"properties":{"content":{"type":"string"}},"required":["content"],"type":"object"}
    CreateTaskRequest: {"additionalProperties":false,"properties":{"dependency_task_ids":{"default":[],"items":{"type":"string"},"type":"array"},"objective":{"type":"string"},"parent_task_id":{"default":null,"type":["string","null"]}},"required":["objective"],"type":"object"}
    UpdateTaskRequest: {"additionalProperties":false,"properties":{"dependency_task_ids":{"default":[],"items":{"type":"string"},"type":"array"},"objective":{"type":"string"}},"required":["objective"],"type":"object"}
    TransitionTaskRequest: {"additionalProperties":false,"properties":{"state":{"$ref":"#/components/schemas/TaskState"}},"required":["state"],"type":"object"}
    AssignTaskRequest: {"additionalProperties":false,"properties":{"run_id":{"type":"string"}},"required":["run_id"],"type":"object"}
    SessionResponse: {"properties":{"session_id":{"type":"string"},"workspace_id":{"type":"string"}},"required":["session_id","workspace_id"],"type":"object"}
    MessageRole: {"enum":["user","assistant"],"type":"string"}
    MessageStatus: {"enum":["complete","incomplete"],"type":"string"}
    MessageResponse: {"properties":{"child_activity":{"anyOf":[{"$ref":"#/components/schemas/ChildActivityReference"},{"type":"null"}]},"content":{"type":"string"},"message_id":{"type":"string"},"model_invocation_id":{"type":["string","null"]},"origin_run_id":{"type":["string","null"]},"role":{"$ref":"#/components/schemas/MessageRole"},"session_id":{"type":"string"},"status":{"$ref":"#/components/schemas/MessageStatus"},"target_run_id":{"type":["string","null"]}},"required":["message_id","session_id","role","content","status","origin_run_id","model_invocation_id","target_run_id"],"type":"object"}
    MessageDeliveryMode: {"enum":["queued","interrupt"],"type":"string"}
    MessageDeliveryState: {"enum":["queued","delivered","failed","cancelled"],"type":"string"}
    MessageDeliveryResponse: {"properties":{"delivery_mode":{"$ref":"#/components/schemas/MessageDeliveryMode"},"message":{"$ref":"#/components/schemas/MessageResponse"},"state":{"$ref":"#/components/schemas/MessageDeliveryState"}},"required":["message","delivery_mode","state"],"type":"object"}
    TaskState: {"enum":["pending","ready","running","blocked","completed","failed","cancelled"],"type":"string"}
    TaskResponse: {"properties":{"assigned_run_id":{"type":["string","null"]},"dependency_task_ids":{"items":{"type":"string"},"type":"array"},"objective":{"type":"string"},"parent_task_id":{"type":["string","null"]},"session_id":{"type":"string"},"state":{"$ref":"#/components/schemas/TaskState"},"task_id":{"type":"string"}},"required":["task_id","session_id","objective","state","parent_task_id","dependency_task_ids","assigned_run_id"],"type":"object"}
    StartRunRequest: {"additionalProperties":false,"properties":{"approval_policy":{"$ref":"#/components/schemas/ApprovalPolicy"},"relative_directory":{"type":"string"},"workspace_root_id":{"type":"string"}},"required":["approval_policy","workspace_root_id","relative_directory"],"type":"object"}
    StartChildRunRequest: {"additionalProperties":false,"properties":{"approval_policy":{"$ref":"#/components/schemas/ApprovalPolicy"},"relative_directory":{"type":"string"},"task_id":{"type":["string","null"]},"user_input_mode":{"$ref":"#/components/schemas/RunInputMode"},"workspace_root_id":{"type":"string"}},"required":["approval_policy","workspace_root_id","relative_directory","user_input_mode","task_id"],"type":"object"}
    SendRunInputRequest: {"additionalProperties":false,"properties":{"content":{"type":"string"},"delivery_mode":{"$ref":"#/components/schemas/MessageDeliveryMode"}},"required":["content","delivery_mode"],"type":"object"}
    ChildActivityReference: {"additionalProperties":false,"properties":{"event_id":{"type":"string"},"run_id":{"type":"string"}},"required":["run_id","event_id"],"type":"object"}
    ReactToRunActivityRequest: {"additionalProperties":false,"properties":{"child_activity":{"$ref":"#/components/schemas/ChildActivityReference"},"content":{"type":"string"}},"required":["content","child_activity"],"type":"object"}
    ApprovalPolicy: {"enum":["ask","read_only","full_access"],"type":"string"}
    ApprovalDecisionRequest: {"additionalProperties":false,"properties":{"decision":{"$ref":"#/components/schemas/ApprovalDecision"}},"required":["decision"],"type":"object"}
    ApprovalDecision: {"enum":["approved","rejected"],"type":"string"}
    RunState: {"enum":["queued","running","waiting_for_approval","cancelling","completed","failed","cancelled"],"type":"string"}
    RunInputMode: {"enum":["interactive","read_only"],"type":"string"}
    ToolCallState: {"enum":["requested","awaiting_approval","ready","running","completed","failed","cancelled","denied"],"type":"string"}
    ToolOutputStream: {"enum":["stdout","stderr"],"type":"string"}
    ArtifactResponse: {"properties":{"content_hash":{"type":"string"},"media_type":{"type":"string"},"size":{"type":"string"}},"required":["content_hash","media_type","size"],"type":"object"}
